name: CI/CD Pipeline with Feature Flags

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  UNLEASH_API_TOKEN: "default:development.unleash-default-token"
  ADMIN_API_TOKEN: "*:*.unleash-default-token"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test Product Service
        run: |
          cd product-service
          mvn clean compile
          mvn test
          mvn package -DskipTests

      - name: Build and Test Order Service
        run: |
          cd order-service
          mvn clean compile
          mvn test
          mvn package -DskipTests

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: |
            product-service/target/*.jar
            order-service/target/*.jar

  docker-integration-test:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifacts
        uses: actions/download-artifact@v4
        with:
          name: service-jars
          path: .

      - name: Copy JARs to correct locations
        run: |
          mkdir -p product-service/target order-service/target
          cp *.jar product-service/target/ || true
          cp *.jar order-service/target/ || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Docker Compose and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose curl jq bc

      - name: Build Docker images
        run: docker-compose build --no-cache

      # 🔥🔥🔥 THIS IS THE IMPORTANT FIX 🔥🔥🔥
      - name: Start services
        run: |
          export PRODUCT_SERVICE_URL=http://product-service:8081
          export UNLEASH_API_URL=http://unleash-server:4242/api

          docker-compose up -d
          docker-compose ps

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to be healthy..."

          check_service_health() {
            local service=$1
            local max_attempts=$2
            local attempt=1

            while [ $attempt -le $max_attempts ]; do
              if docker inspect --format='{{.State.Health.Status}}' $service 2>/dev/null | grep -q "healthy"; then
                echo "✅ $service is healthy"
                return 0
              fi

              echo "⏳ Waiting for $service..."
              sleep 10
              attempt=$((attempt + 1))
            done

            echo "❌ $service failed to become healthy"
            docker logs $service
            exit 1
          }

          check_service_health "unleash-postgres" 15
          check_service_health "unleash-server" 20
          check_service_health "product-service" 25
          check_service_health "order-service" 30

          sleep 15
          echo "✅ All services healthy

      - name: Initialize feature flags
        run: |
          chmod +x scripts/init-flags.sh
          ./scripts/init-flags.sh
          
          # Wait for flags to propagate to services (Unleash client polls every 10 seconds)
          echo "Waiting for flags to propagate to services..."
          sleep 15

      - name: Create test product
        run: |
          echo "📦 Creating test product..."
          
          # Create product via API
          PRODUCT_RESPONSE=$(curl -s -X POST http://localhost:8081/api/products \
            -H "Content-Type: application/json" \
            -d '{"name": "Laptop", "price": 1000.00, "quantity": 100}')
          
          echo "Product Response: $PRODUCT_RESPONSE"
          PRODUCT_ID=$(echo $PRODUCT_RESPONSE | jq -r '.id')
          
          if [ "$PRODUCT_ID" = "null" ] || [ -z "$PRODUCT_ID" ]; then
            echo "❌ Failed to create product"
            exit 1
          fi
          
          echo "✅ Product created with ID: $PRODUCT_ID"
          echo "PRODUCT_ID=$PRODUCT_ID" >> $GITHUB_ENV

      - name: Test premium-pricing flag
        run: |
          echo -e "\n🧪 Testing premium-pricing flag..."
          
          # Get regular product price
          REGULAR_PRICE=$(curl -s http://localhost:8081/api/products/$PRODUCT_ID | jq -r '.price')
          echo "Regular price: $REGULAR_PRICE"
          
          # Get premium products - find our product in the list
          PREMIUM_RESPONSE=$(curl -s http://localhost:8081/api/products/premium)
          
          # Extract our product's premium price
          PREMIUM_PRICE=$(echo "$PREMIUM_RESPONSE" | jq -r ".[] | select(.id == $PRODUCT_ID) | .price")
          
          echo "Premium price: $PREMIUM_PRICE"
          
          # Calculate expected price with 10% discount
          EXPECTED_PRICE=$(echo "$REGULAR_PRICE * 0.9" | bc)
          
          # Compare with tolerance for floating point
          DIFF=$(echo "$PREMIUM_PRICE - $EXPECTED_PRICE" | bc)
          ABS_DIFF=$(echo "${DIFF#-}")
          
          if (( $(echo "$ABS_DIFF < 0.01" | bc -l) )); then
            echo "✅ premium-pricing flag is working (10% discount applied)"
          else
            echo "❌ premium-pricing flag test failed - Expected: $EXPECTED_PRICE, Got: $PREMIUM_PRICE"
          
            # Debug output
            echo "Full premium response:"
            echo "$PREMIUM_RESPONSE" | jq '.'
          
            # Check if flag is enabled by calling the service's method directly
            echo "Checking if product service sees the flag as enabled..."
            docker exec product-service curl -s http://localhost:8081/api/products | head -1
          
            exit 1
          fi

      - name: Test bulk-order-discount flag
        run: |
          echo -e "\n🧪 Testing bulk-order-discount flag..."

          # First, verify product service is accessible
          echo "Verifying product service is accessible..."
          PRODUCT_SERVICE_TEST=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/api/products)
          if [ "$PRODUCT_SERVICE_TEST" != "200" ]; then
            echo "❌ Product service is not accessible (HTTP $PRODUCT_SERVICE_TEST)"

            # Check if product service is running
            docker ps | grep product-service

            # Check product service logs
            echo "Product service logs:"
            docker logs product-service --tail 30

            exit 1
          fi
          echo "✅ Product service is accessible"

          # Get regular product price first
          REGULAR_PRICE=$(curl -s http://localhost:8081/api/products/$PRODUCT_ID | jq -r '.price')
          echo "Product price: $REGULAR_PRICE"

          # Check if order service can resolve product-service hostname
          echo "Checking if order-service can resolve product-service..."
          docker exec order-service nslookup product-service || echo "nslookup not available"
          docker exec order-service ping -c 2 product-service || echo "ping not available"

          # Test from within order-service container
          echo "Testing from within order-service container..."
          docker exec order-service curl -v http://product-service:8081/api/products || true

          # Create order with bulk quantity (should get 15% discount)
          echo "Creating bulk order with quantity 10..."
          BULK_ORDER_RESPONSE=$(curl -v -X POST http://localhost:8082/api/orders \
            -H "Content-Type: application/json" \
            -d "{\"productId\": $PRODUCT_ID, \"quantity\": 10, \"status\": \"PENDING\"}" 2>&1)

          echo "Bulk Order Response: $BULK_ORDER_RESPONSE"

          # Check if the response is valid JSON
          if echo "$BULK_ORDER_RESPONSE" | jq . >/dev/null 2>&1; then
            # Extract total price from response
            BULK_ORDER_TOTAL=$(echo "$BULK_ORDER_RESPONSE" | jq -r '.totalPrice')

            # Calculate expected price (price * quantity * 0.85)
            EXPECTED_BULK_PRICE=$(echo "$REGULAR_PRICE * 10 * 0.85" | bc)

            # Compare with tolerance
            DIFF=$(echo "$BULK_ORDER_TOTAL - $EXPECTED_BULK_PRICE" | bc)
            ABS_DIFF=$(echo "${DIFF#-}")

            if (( $(echo "$ABS_DIFF < 0.01" | bc -l) )); then
              echo "✅ bulk-order-discount flag is working (15% discount applied)"
            else
              echo "❌ bulk-order-discount flag test failed - Expected: $EXPECTED_BULK_PRICE, Got: $BULK_ORDER_TOTAL"
              exit 1
            fi
          else
            echo "❌ Invalid JSON response from order service"
            echo "Raw response: $BULK_ORDER_RESPONSE"

            # Check order service logs
            echo "Order service logs:"
            docker logs order-service --tail 50

            exit 1
          fi

      - name: Test order-notifications flag
        run: |
          echo -e "\n🧪 Testing order-notifications flag..."
          
          # Clear logs
          docker logs order-service > /dev/null 2>&1 || true
          
          # Create regular order with quantity 2
          echo "Creating regular order with quantity 2..."
          REGULAR_ORDER_RESPONSE=$(curl -s -X POST http://localhost:8082/api/orders \
            -H "Content-Type: application/json" \
            -d "{\"productId\": $PRODUCT_ID, \"quantity\": 2, \"status\": \"PENDING\"}")
          
          echo "Regular Order Response: $REGULAR_ORDER_RESPONSE"
          
          # Wait for logs to be written
          sleep 3
          
          # Check logs for notification
          LOGS=$(docker logs order-service 2>&1)
          
          if echo "$LOGS" | grep -q "ORDER NOTIFICATION"; then
            echo "✅ order-notifications flag is working (notification logged)"
          else
            echo "❌ order-notifications flag test failed - notification not found in logs"
            echo "Recent logs:"
            echo "$LOGS" | tail -20
            exit 1
          fi

      - name: Test flag toggle behavior
        run: |
          echo -e "\n🧪 Testing flag toggle behavior..."
          
          # First verify flag is enabled
          echo "Verifying premium-pricing flag is enabled..."
          FLAG_STATUS=$(curl -s -H "Authorization: $ADMIN_API_TOKEN" \
            http://localhost:4242/api/admin/projects/default/features/premium-pricing)
          
          IS_ENABLED=$(echo "$FLAG_STATUS" | jq -r '.environments[] | select(.name=="development") | .enabled')
          echo "premium-pricing flag enabled: $IS_ENABLED"
          
          # Get current premium price
          PREMIUM_RESPONSE_BEFORE=$(curl -s http://localhost:8081/api/products/premium)
          PREMIUM_PRICE_BEFORE=$(echo "$PREMIUM_RESPONSE_BEFORE" | jq -r ".[] | select(.id == $PRODUCT_ID) | .price")
          echo "Premium price before disabling: $PREMIUM_PRICE_BEFORE"
          
          # Disable premium-pricing flag
          echo "Disabling premium-pricing flag..."
          curl -s -X POST "http://localhost:4242/api/admin/projects/default/features/premium-pricing/environments/development/off" \
            -H "Authorization: $ADMIN_API_TOKEN" \
            -H "Content-Type: application/json"
          
          # Wait for flag to propagate (Unleash client polls every 10 seconds)
          echo "Waiting for flag change to propagate..."
          sleep 15
          
          # Get premium price after disabling
          PREMIUM_RESPONSE_AFTER=$(curl -s http://localhost:8081/api/products/premium)
          PREMIUM_PRICE_AFTER=$(echo "$PREMIUM_RESPONSE_AFTER" | jq -r ".[] | select(.id == $PRODUCT_ID) | .price")
          
          # Get regular price
          REGULAR_PRICE=$(curl -s http://localhost:8081/api/products/$PRODUCT_ID | jq -r '.price')
          
          echo "Regular price: $REGULAR_PRICE"
          echo "Premium price after disabling: $PREMIUM_PRICE_AFTER"
          
          # Check if premium price equals regular price (no discount)
          DIFF=$(echo "$PREMIUM_PRICE_AFTER - $REGULAR_PRICE" | bc)
          ABS_DIFF=$(echo "${DIFF#-}")
          
          if (( $(echo "$ABS_DIFF < 0.01" | bc -l) )); then
            echo "✅ Flag toggle is working (discount removed after disabling)"
          else
            echo "❌ Flag toggle test failed - Price didn't return to regular"
            echo "Expected: $REGULAR_PRICE, Got: $PREMIUM_PRICE_AFTER"
            exit 1
          fi

      - name: Show Docker logs
        if: always()
        run: |
          echo "=== Docker Container Status ==="
          docker-compose ps
          echo -e "\n=== Service Logs ==="
          docker-compose logs --tail=100

      - name: Stop services
        if: always()
        run: docker-compose down -v