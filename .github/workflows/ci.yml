name: PROG3360 Assignment Two CI/CD

on:
  push:
    branches:
      - main
  pull_request:

env:
  ADMIN_TOKEN: "*:*.unleash-default-token"
  UNLEASH_API_URL: "http://localhost:4242/api"

jobs:
  build-and-test:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Build Product Service
        run: |
          cd product-service
          mvn clean test

      - name: Build Order Service
        run: |
          cd order-service
          mvn clean test

      - name: Upload Unit Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            product-service/target/surefire-reports/
            order-service/target/surefire-reports/

  docker-build-and-integration:
    name: Docker Build & Integration Test
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Docker Compose and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose curl jq bc

      - name: Build and Start Docker Stack
        run: |
          docker-compose -f docker-compose.yml up -d --build
          docker-compose ps

      - name: Wait for PostgreSQL
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..30}; do
            if docker exec unleash-postgres pg_isready -U unleash_user > /dev/null 2>&1; then
              echo "✅ PostgreSQL is ready"
              break
            fi
            echo "⏳ Waiting for PostgreSQL... ($i/30)"
            sleep 5
          done

      - name: Wait for Unleash Server
        run: |
          echo "Waiting for Unleash to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:4242/health > /dev/null; then
              echo "✅ Unleash is ready"
              break
            fi
            echo "⏳ Waiting for Unleash... ($i/30)"
            sleep 5
          done

      - name: Wait for Product Service
        run: |
          echo "Waiting for Product Service to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:8081/actuator/health | grep -q "UP"; then
              echo "✅ Product Service is ready"
              break
            fi
            echo "⏳ Waiting for Product Service... ($i/30)"
            sleep 5
          done

      - name: Wait for Order Service
        run: |
          echo "Waiting for Order Service to be ready..."
          for i in {1..30}; do
            if curl -s http://localhost:8082/actuator/health | grep -q "UP"; then
              echo "✅ Order Service is ready"
              break
            fi
            echo "⏳ Waiting for Order Service... ($i/30)"
            sleep 5
          done

      - name: Initialize Feature Flags
        run: |
          chmod +x ./scripts/init-flags.sh
          ./scripts/init-flags.sh
          sleep 10

      - name: Create Test Product
        run: |
          echo "📦 Creating test product..."
          PRODUCT_RESPONSE=$(curl -s -X POST http://localhost:8081/api/products \
            -H "Content-Type: application/json" \
            -d '{"name": "Test Laptop", "price": 1000.00, "quantity": 100}')
          
          echo "Product Response: $PRODUCT_RESPONSE"
          PRODUCT_ID=$(echo $PRODUCT_RESPONSE | jq -r '.id')
          echo "PRODUCT_ID=$PRODUCT_ID" >> $GITHUB_ENV

      - name: Fix Network Connectivity
        run: |
          echo "🔧 Fixing network connectivity between services..."
          
          # Get the product service container IP
          PRODUCT_IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' product-service)
          echo "Product service IP: $PRODUCT_IP"
          
          # Add host entry to order service container
          docker exec order-service sh -c "echo '$PRODUCT_IP product-service' >> /etc/hosts"
          
          # Verify connectivity
          echo "Verifying connectivity:"
          docker exec order-service curl -s http://product-service:8081/api/products || echo "Still cannot connect"
          
          # Also try with IP directly
          echo "Trying with IP directly:"
          docker exec order-service curl -s http://$PRODUCT_IP:8081/api/products || echo "IP connection failed"

      - name: Test premium-pricing flag
        run: |
          echo -e "\n🧪 Testing premium-pricing flag..."
          
          # Get regular price
          REGULAR_PRICE=$(curl -s http://localhost:8081/api/products/$PRODUCT_ID | jq -r '.price')
          echo "Regular price: $REGULAR_PRICE"
          
          # Get premium price
          PREMIUM_RESPONSE=$(curl -s http://localhost:8081/api/products/premium)
          PREMIUM_PRICE=$(echo "$PREMIUM_RESPONSE" | jq -r ".[] | select(.id == $PRODUCT_ID) | .price")
          echo "Premium price: $PREMIUM_PRICE"
          
          # Check if discount applied (10% discount)
          EXPECTED_PRICE=$(echo "$REGULAR_PRICE * 0.9" | bc)
          DIFF=$(echo "$PREMIUM_PRICE - $EXPECTED_PRICE" | bc)
          ABS_DIFF=$(echo "${DIFF#-}")
          
          if (( $(echo "$ABS_DIFF < 0.01" | bc -l) )); then
            echo "✅ premium-pricing flag is working (10% discount applied)"
          else
            echo "❌ premium-pricing flag test failed"
            echo "Expected: $EXPECTED_PRICE, Got: $PREMIUM_PRICE"
            exit 1
          fi

      - name: Test bulk-order-discount flag
        run: |
          echo -e "\n🧪 Testing bulk-order-discount flag..."
          
          # Get product price from host
          REGULAR_PRICE=$(curl -s http://localhost:8081/api/products/$PRODUCT_ID | jq -r '.price')
          echo "Product price: $REGULAR_PRICE"
          
          # Try to create order - but first, let's test if order service can reach product service
          echo "Testing order service to product service connectivity:"
          docker exec order-service curl -v http://product-service:8081/api/products/$PRODUCT_ID || true
          
          # Create bulk order using the container's internal network
          echo "Creating bulk order with quantity 10..."
          
          # Use the container's internal network by curling from within the container
          # This bypasses any host networking issues
          BULK_ORDER_RESPONSE=$(docker exec order-service curl -s -X POST http://localhost:8082/api/orders \
            -H "Content-Type: application/json" \
            -d "{\"productId\": $PRODUCT_ID, \"quantity\": 10, \"status\": \"PENDING\"}")
          
          echo "Bulk Order Response: $BULK_ORDER_RESPONSE"
          
          # Extract total price
          if echo "$BULK_ORDER_RESPONSE" | jq . >/dev/null 2>&1; then
            BULK_ORDER_TOTAL=$(echo "$BULK_ORDER_RESPONSE" | jq -r '.totalPrice')
          
            # Calculate expected price with 15% discount
            EXPECTED_PRICE=$(echo "$REGULAR_PRICE * 10 * 0.85" | bc)
            DIFF=$(echo "$BULK_ORDER_TOTAL - $EXPECTED_PRICE" | bc)
            ABS_DIFF=$(echo "${DIFF#-}")
          
            if (( $(echo "$ABS_DIFF < 0.01" | bc -l) )); then
              echo "✅ bulk-order-discount flag is working (15% discount applied)"
            else
              echo "❌ bulk-order-discount flag test failed"
              echo "Expected: $EXPECTED_PRICE, Got: $BULK_ORDER_TOTAL"
              exit 1
            fi
          else
            echo "❌ Invalid JSON response"
            echo "Raw response: $BULK_ORDER_RESPONSE"
          
            # Check order service logs
            echo "Order service logs:"
            docker logs order-service --tail 30
            exit 1
          fi

      - name: Test order-notifications flag
        run: |
          echo -e "\n🧪 Testing order-notifications flag..."
          
          # Clear logs
          docker logs order-service > /dev/null 2>&1 || true
          
          # Create order using docker exec to ensure internal network
          ORDER_RESPONSE=$(docker exec order-service curl -s -X POST http://localhost:8082/api/orders \
            -H "Content-Type: application/json" \
            -d "{\"productId\": $PRODUCT_ID, \"quantity\": 2, \"status\": \"PENDING\"}")
          
          echo "Order Response: $ORDER_RESPONSE"
          ORDER_ID=$(echo "$ORDER_RESPONSE" | jq -r '.id')
          
          sleep 3
          
          # Check logs for notification
          LOGS=$(docker logs order-service 2>&1)
          if echo "$LOGS" | grep -q "ORDER NOTIFICATION.*$ORDER_ID"; then
            echo "✅ order-notifications flag is working (notification logged)"
          else
            echo "❌ order-notifications flag test failed"
            echo "Recent logs:"
            echo "$LOGS" | tail -20
            exit 1
          fi

      - name: Show Docker Logs
        if: always()
        run: |
          echo "=== Docker Container Status ==="
          docker-compose ps
          echo -e "\n=== Product Service Logs ==="
          docker logs product-service --tail 30
          echo -e "\n=== Order Service Logs ==="
          docker logs order-service --tail 30

      - name: Tear down Docker Stack
        if: always()
        run: docker-compose -f docker-compose.yml down --volumes