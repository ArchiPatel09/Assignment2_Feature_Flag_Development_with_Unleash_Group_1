name: CI/CD Pipeline with Feature Flags

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  UNLEASH_API_TOKEN: "default:development.unleash-default-token"
  ADMIN_API_TOKEN: "*:*.unleash-default-token"

jobs:
  # Job 1: Build & Test
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test Product Service
        run: |
          cd product-service
          mvn clean compile
          mvn test
          mvn package -DskipTests

      - name: Build and Test Order Service
        run: |
          cd order-service
          mvn clean compile
          mvn test
          mvn package -DskipTests

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: |
            product-service/target/*.jar
            order-service/target/*.jar

  # Job 2: Docker Build & Integration Test
  docker-integration-test:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download JAR artifacts
        uses: actions/download-artifact@v4
        with:
          name: service-jars
          path: .

      - name: Copy JARs to correct locations
        run: |
          mkdir -p product-service/target order-service/target
          cp *.jar product-service/target/ || true
          cp *.jar order-service/target/ || true
          ls -la product-service/target/
          ls -la order-service/target/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Docker Compose and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y docker-compose curl jq bc

      - name: Build Docker images
        run: |
          docker-compose build --no-cache

      - name: Start services
        run: |
          docker-compose up -d
          docker-compose ps

      - name: Wait for services to be healthy with better timeout
        run: |
          echo "Waiting for services to be healthy..."
          
          # Function to check service health
          check_service_health() {
            local service=$1
            local max_attempts=$2
            local attempt=1
          
            echo "Checking $service..."
            while [ $attempt -le $max_attempts ]; do
              if docker inspect --format='{{.State.Health.Status}}' $service 2>/dev/null | grep -q "healthy"; then
                echo "✅ $service is healthy (attempt $attempt)"
                return 0
              fi
          
              # Check if container is running but health check not yet started
              if docker inspect --format='{{.State.Status}}' $service 2>/dev/null | grep -q "running"; then
                echo "⏳ $service is running but health check not yet complete (attempt $attempt/$max_attempts)"
              else
                echo "⏳ $service status: $(docker inspect --format='{{.State.Status}}' $service 2>/dev/null || echo 'unknown')"
              fi
          
              # Show recent logs for debugging
              if [ $((attempt % 5)) -eq 0 ]; then
                echo "Recent logs for $service:"
                docker logs --tail 10 $service 2>/dev/null || true
              fi
          
              sleep 10
              attempt=$((attempt + 1))
            done
          
            echo "❌ $service failed to become healthy after $max_attempts attempts"
            docker logs $service
            return 1
          }
          
          # Wait for PostgreSQL (10 attempts)
          check_service_health "unleash-postgres" 15 || exit 1
          
          # Wait for Unleash (15 attempts)
          check_service_health "unleash-server" 20 || exit 1
          
          # Additional wait for Unleash API to be fully ready
          echo "Waiting for Unleash API to be fully ready..."
          sleep 15
          
          # Wait for Product Service (20 attempts)
          check_service_health "product-service" 25 || exit 1
          
          # Wait for Order Service (25 attempts)
          check_service_health "order-service" 30 || exit 1
          
          echo "✅ All services are healthy!"

      - name: Initialize feature flags
        run: |
          chmod +x scripts/init-flags.sh
          ./scripts/init-flags.sh
          
          # Wait for flags to propagate
          sleep 5

      - name: Create test product
        run: |
          echo "📦 Creating test product..."
          
          # Create product via API
          PRODUCT_RESPONSE=$(curl -s -X POST http://localhost:8081/api/products \
            -H "Content-Type: application/json" \
            -d '{"name": "Laptop", "price": 1000.00, "quantity": 100}')
          
          echo "Product Response: $PRODUCT_RESPONSE"
          PRODUCT_ID=$(echo $PRODUCT_RESPONSE | jq -r '.id')
          
          if [ "$PRODUCT_ID" = "null" ] || [ -z "$PRODUCT_ID" ]; then
            echo "❌ Failed to create product"
            exit 1
          fi
          
          echo "✅ Product created with ID: $PRODUCT_ID"
          echo "PRODUCT_ID=$PRODUCT_ID" >> $GITHUB_ENV

      - name: Test premium-pricing flag
        run: |
          echo -e "\n🧪 Testing premium-pricing flag..."
          
          # Get regular product price
          REGULAR_PRICE=$(curl -s http://localhost:8081/api/products/$PRODUCT_ID | jq -r '.price')
          echo "Regular price: $REGULAR_PRICE"
          
          # Get premium products
          PREMIUM_RESPONSE=$(curl -s http://localhost:8081/api/products/premium)
          PREMIUM_PRICE=$(echo "$PREMIUM_RESPONSE" | jq -r ".[] | select(.id == $PRODUCT_ID) | .price")
          
          echo "Premium price: $PREMIUM_PRICE"
          
          # Check if discount applied (10% discount)
          EXPECTED_PRICE=$(echo "$REGULAR_PRICE * 0.9" | bc)
          
          if (( $(echo "$PREMIUM_PRICE == $EXPECTED_PRICE" | bc -l) )); then
            echo "✅ premium-pricing flag is working (10% discount applied)"
          else
            echo "❌ premium-pricing flag test failed - Expected: $EXPECTED_PRICE, Got: $PREMIUM_PRICE"
            exit 1
          fi

      - name: Test bulk-order-discount flag
        run: |
          echo -e "\n🧪 Testing bulk-order-discount flag..."
          
          # Create order with bulk quantity (should get 15% discount)
          echo "Creating bulk order with quantity 10..."
          BULK_ORDER_RESPONSE=$(curl -s -X POST http://localhost:8082/api/orders \
            -H "Content-Type: application/json" \
            -d "{\"productId\": $PRODUCT_ID, \"quantity\": 10, \"status\": \"PENDING\"}")
          
          echo "Bulk Order Response: $BULK_ORDER_RESPONSE"
          BULK_ORDER_TOTAL=$(echo "$BULK_ORDER_RESPONSE" | jq -r '.totalPrice')
          
          # Calculate expected price (1000 * 10 * 0.85 = 8500)
          EXPECTED_BULK_PRICE="8500.0"
          
          if (( $(echo "$BULK_ORDER_TOTAL == $EXPECTED_BULK_PRICE" | bc -l) )); then
            echo "✅ bulk-order-discount flag is working (15% discount applied)"
          else
            echo "❌ bulk-order-discount flag test failed - Expected: $EXPECTED_BULK_PRICE, Got: $BULK_ORDER_TOTAL"
            exit 1
          fi

      - name: Test order-notifications flag
        run: |
          echo -e "\n🧪 Testing order-notifications flag..."
          
          # Get logs before creating order
          docker logs order-service > logs_before.txt
          
          # Create regular order
          echo "Creating regular order with quantity 2..."
          REGULAR_ORDER_RESPONSE=$(curl -s -X POST http://localhost:8082/api/orders \
            -H "Content-Type: application/json" \
            -d "{\"productId\": $PRODUCT_ID, \"quantity\": 2, \"status\": \"PENDING\"}")
          
          echo "Regular Order Response: $REGULAR_ORDER_RESPONSE"
          
          # Wait for logs
          sleep 2
          
          # Check logs for notification
          docker logs order-service > logs_after.txt
          
          if grep -q "ORDER NOTIFICATION" logs_after.txt && ! grep -q "ORDER NOTIFICATION" logs_before.txt; then
            echo "✅ order-notifications flag is working (notification logged)"
          else
            echo "❌ order-notifications flag test failed - notification not found in logs"
            exit 1
          fi

      - name: Test flag toggle behavior
        run: |
          echo -e "\n🧪 Testing flag toggle behavior..."
          
          # Disable premium-pricing flag
          echo "Disabling premium-pricing flag..."
          curl -s -X POST "http://localhost:4242/api/admin/projects/default/features/premium-pricing/environments/development/off" \
            -H "Authorization: $ADMIN_API_TOKEN" \
            -H "Content-Type: application/json"
          
          # Wait for flag to propagate
          sleep 10
          
          # Get regular price
          REGULAR_PRICE=$(curl -s http://localhost:8081/api/products/$PRODUCT_ID | jq -r '.price')
          
          # Check if discount is removed
          NEW_PREMIUM_RESPONSE=$(curl -s http://localhost:8081/api/products/premium)
          NEW_PREMIUM_PRICE=$(echo "$NEW_PREMIUM_RESPONSE" | jq -r ".[] | select(.id == $PRODUCT_ID) | .price")
          
          echo "Regular price: $REGULAR_PRICE"
          echo "New premium price after disabling: $NEW_PREMIUM_PRICE"
          
          if (( $(echo "$NEW_PREMIUM_PRICE == $REGULAR_PRICE" | bc -l) )); then
            echo "✅ Flag toggle is working (discount removed after disabling)"
          else
            echo "❌ Flag toggle test failed - Price didn't return to regular"
            exit 1
          fi

      - name: Show Docker logs
        if: always()
        run: |
          echo "=== Docker Container Status ==="
          docker-compose ps
          echo -e "\n=== Service Logs ==="
          docker-compose logs --tail=100

      - name: Stop services
        if: always()
        run: docker-compose down -v

  # Job 3: Feature Flag Validation
  feature-flag-validation:
    runs-on: ubuntu-latest
    needs: docker-integration-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y curl jq docker-compose

      - name: Start Unleash and PostgreSQL
        run: |
          docker-compose up -d postgres unleash-server
          sleep 30

      - name: Validate feature flags
        run: |
          echo -e "\n🔍 Validating feature flags..."
          
          # Initialize flags
          chmod +x scripts/init-flags.sh
          ./scripts/init-flags.sh
          
          sleep 5
          
          # Get all flags
          FLAGS=$(curl -s -H "Authorization: $ADMIN_API_TOKEN" \
            http://localhost:4242/api/admin/projects/default/features)
          
          # Check each flag exists and is enabled
          for flag in "premium-pricing" "order-notifications" "bulk-order-discount"; do
            if echo "$FLAGS" | jq -e ".features[] | select(.name == \"$flag\")" > /dev/null; then
              # Check if flag is enabled
              IS_ENABLED=$(echo "$FLAGS" | jq -r ".features[] | select(.name == \"$flag\") | .environments[0].enabled")
              if [ "$IS_ENABLED" = "true" ]; then
                echo "✅ $flag flag exists and is enabled"
              else
                echo "⚠️  $flag flag exists but is not enabled"
              fi
            else
              echo "❌ $flag flag not found"
              exit 1
            fi
          done
          
          # Test fallback behavior (flag doesn't exist)
          echo -e "\nTesting fallback behavior..."
          NON_EXISTENT_FLAG=$(curl -s -H "Authorization: $ADMIN_API_TOKEN" \
            "http://localhost:4242/api/admin/projects/default/features/non-existent-flag" || echo "404")
          
          if echo "$NON_EXISTENT_FLAG" | grep -q "404"; then
            echo "✅ Fallback behavior working (non-existent flag returns 404)"
          fi
          
          echo -e "\n✅ All feature flags validated successfully!"

      - name: Cleanup
        if: always()
        run: docker-compose down -v

  # Bonus: Code Quality
  code-quality:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Run code quality checks
        run: |
          # Product Service
          cd product-service
          echo "Running Checkstyle on Product Service..."
          mvn checkstyle:check || true
          echo "Running PMD on Product Service..."
          mvn pmd:check || true
          
          cd ../order-service
          echo "Running Checkstyle on Order Service..."
          mvn checkstyle:check || true
          echo "Running PMD on Order Service..."
          mvn pmd:check || true

      - name: Generate coverage report
        run: |
          cd product-service
          mvn jacoco:report
          cd ../order-service
          mvn jacoco:report

      - name: Check coverage threshold (70%)
        run: |
          # Check Product Service coverage
          cd product-service/target/site/jacoco
          if [ -f index.html ]; then
            COVERAGE=$(grep -o 'Total.*?%' index.html | head -1 | grep -o '[0-9.]*')
            echo "Product Service coverage: $COVERAGE%"
            if (( $(echo "$COVERAGE < 70" | bc -l) )); then
              echo "⚠️  Product Service coverage below 70%"
            fi
          fi
          
          # Check Order Service coverage
          cd ../../../../order-service/target/site/jacoco
          if [ -f index.html ]; then
            COVERAGE=$(grep -o 'Total.*?%' index.html | head -1 | grep -o '[0-9.]*')
            echo "Order Service coverage: $COVERAGE%"
            if (( $(echo "$COVERAGE < 70" | bc -l) )); then
              echo "⚠️  Order Service coverage below 70%"
            fi
          fi

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            **/target/site/jacoco/